openapi: 3.0.3
info:
  title: Bus Ticket Booking API
  version: 1.0.0
  description: Complete API documentation for Bus Ticket Booking System including Routes, Stops, Buses, and Seats management.
  contact:
    name: API Support
    email: support@busticket.com

servers:
  - url: http://localhost:8010/v1
    description: Local development server
  - url: https://api.busticket.com/v1
    description: Production server

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: JWT access token stored in HTTP-only cookie

  schemas:
    # Common schemas
    PaginationResponse:
      $ref: './schemas/bus.yaml#/PaginationResponse'

    # Stop schemas
    Stop:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        address: { type: string, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StopCreate:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        address: { type: string }
        active: { type: boolean }

    StopUpdate:
      type: object
      properties:
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        address: { type: string }
        active: { type: boolean }

    # Route schemas
    RouteStopItem:
      type: object
      required: [stopId, sequence]
      properties:
        stopId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        isPickup: { type: boolean }
        isDropoff: { type: boolean }
        note: { type: string }

    Route:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        operatorId: { type: string, format: uuid }
        originStopId: { type: string, format: uuid }
        destinationStopId: { type: string, format: uuid }
        distanceKm: { type: number }
        estimatedMinutes: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RouteCreate:
      type: object
      required: [name, operatorId, originStopId, destinationStopId]
      properties:
        name: { type: string }
        operatorId: { type: string, format: uuid }
        originStopId: { type: string, format: uuid }
        destinationStopId: { type: string, format: uuid }
        distanceKm: { type: number }
        estimatedMinutes: { type: integer }
        active: { type: boolean }
        stops:
          type: array
          items: { $ref: '#/components/schemas/RouteStopItem' }

    RouteUpdate:
      type: object
      properties:
        name: { type: string }
        distanceKm: { type: number }
        estimatedMinutes: { type: integer }
        active: { type: boolean }
        stops:
          type: array
          items: { $ref: '#/components/schemas/RouteStopItem' }

    # Bus schemas
    Bus:
      $ref: './schemas/bus.yaml#/Bus'

    BusCreate:
      $ref: './schemas/bus.yaml#/BusCreate'

    BusUpdate:
      $ref: './schemas/bus.yaml#/BusUpdate'

    # Seat schemas
    Seat:
      $ref: './schemas/bus.yaml#/Seat'

    SeatItem:
      $ref: './schemas/bus.yaml#/SeatItem'

paths:
  # Stop endpoints
  /stops:
    get:
      summary: List stops
      tags: [Stops]
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Stop' }
    post:
      summary: Create stop
      tags: [Stops]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stop' }

  /stops/{id}:
    get:
      summary: Get stop by id
      tags: [Stops]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stop' }
    put:
      summary: Update stop
      tags: [Stops]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stop' }
    delete:
      summary: Delete stop
      tags: [Stops]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted

  # Route endpoints
  /routes:
    get:
      summary: List routes
      tags: [Routes]
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Route' }
    post:
      summary: Create route
      tags: [Routes]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }

  /routes/{id}:
    get:
      summary: Get route
      tags: [Routes]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
    put:
      summary: Update route
      tags: [Routes]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
    delete:
      summary: Delete route
      tags: [Routes]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted

  # Bus endpoints (from external file)
  /buses:
    $ref: './paths/buses.yaml#/~1buses'

  /buses/search:
    $ref: './paths/buses.yaml#/~1buses~1search'

  /buses/{id}:
    $ref: './paths/buses.yaml#/~1buses~1{id}'

  /buses/{busId}/layout:
    $ref: './paths/buses.yaml#/~1buses~1{busId}~1layout'

  # Seat endpoints (from external file)
  /buses/{busId}/seats:
    $ref: './paths/seats.yaml#/~1buses~1{busId}~1seats'

  /buses/{busId}/seats/generate:
    $ref: './paths/seats.yaml#/~1buses~1{busId}~1seats~1generate'

  /buses/{busId}/seats/{seatId}:
    $ref: './paths/seats.yaml#/~1buses~1{busId}~1seats~1{seatId}'

tags:
  - name: Stops
    description: Bus stop management
  - name: Routes
    description: Route management
  - name: Buses
    description: Bus fleet management
  - name: Seats
    description: Seat configuration and management
