/buses/{busId}/seats:
  get:
    summary: List seats
    tags: [Seats]
    security: [{ cookieAuth: [] }]
    parameters:
      - in: path
        name: busId
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: includeInactive
        schema: { type: boolean }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Seat' }
  post:
    summary: Create seats
    tags: [Seats]
    security: [{ cookieAuth: [] }]
    parameters:
      - in: path
        name: busId
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              seats:
                type: array
                items: { $ref: '#/components/schemas/SeatItem' }
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Seat' }

/buses/{busId}/seats/generate:
  post:
    summary: Auto-generate seats
    tags: [Seats]
    security: [{ cookieAuth: [] }]
    parameters:
      - in: path
        name: busId
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [layout, rows]
            properties:
              layout: { type: string, enum: ['2-2', '2-3', '1-2', '2-1'] }
              rows: { type: integer, minimum: 1, maximum: 20 }
              seatType: { type: string, enum: [regular, premium, sleeper] }
              startRow: { type: integer, default: 1 }
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Seat' }

/buses/{busId}/seats/{seatId}:
  put:
    summary: Update seat
    tags: [Seats]
    security: [{ cookieAuth: [] }]
    parameters:
      - in: path
        name: busId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: seatId
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              seatNumber: { type: string }
              seatType: { type: string, enum: [regular, premium, sleeper] }
              isActive: { type: boolean }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Seat' }
  delete:
    summary: Delete seat
    tags: [Seats]
    security: [{ cookieAuth: [] }]
    parameters:
      - in: path
        name: busId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: seatId
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Deleted
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted: { type: boolean }
