/buses:
  get:
    summary: List buses with pagination
    tags: [Buses]
    security: [{ cookieAuth: [] }]
    parameters:
      - in: query
        name: page
        schema: { type: integer, default: 1 }
      - in: query
        name: limit
        schema: { type: integer, default: 20 }
      - in: query
        name: operatorId
        schema: { type: string, format: uuid }
      - in: query
        name: plateNumber
        schema: { type: string }
      - in: query
        name: minCapacity
        schema: { type: integer }
      - in: query
        name: search
        schema: { type: string }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items: { $ref: '#/components/schemas/Bus' }
                pagination: { $ref: '#/components/schemas/PaginationResponse' }
  post:
    summary: Create bus
    tags: [Buses]
    security: [{ cookieAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BusCreate' }
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Bus' }

/buses/search:
  get:
    summary: Search buses (public)
    tags: [Buses]
    parameters:
      - in: query
        name: originStopId
        schema: { type: string, format: uuid }
      - in: query
        name: destinationStopId
        schema: { type: string, format: uuid }
      - in: query
        name: date
        schema: { type: string, format: date }
      - in: query
        name: seatType
        schema: { type: string }
      - in: query
        name: minSeats
        schema: { type: integer }
      - in: query
        name: amenities
        schema: { type: string }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Bus' }

/buses/{id}:
  get:
    summary: Get bus details
    tags: [Buses]
    security: [{ cookieAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Bus' }
  put:
    summary: Update bus
    tags: [Buses]
    security: [{ cookieAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BusUpdate' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Bus' }
  delete:
    summary: Delete bus
    tags: [Buses]
    security: [{ cookieAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Deleted
        content:
          application/json:
            schema:
              type: object
              properties:
                deleted: { type: boolean }

/buses/{busId}/layout:
  get:
    summary: Get seat layout (public)
    tags: [Buses]
    parameters:
      - in: path
        name: busId
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: tripId
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Seat' }
